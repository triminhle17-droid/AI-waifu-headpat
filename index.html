<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>VRM Layer Behind Person - Clean</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: sans-serif;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #bg-canvas, #vrm-canvas, #person-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    #bg-canvas { z-index: 1; }
    #vrm-canvas { z-index: 2; }
    #person-canvas { z-index: 3; }

    #video { display: none; }

    #controls {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .pill {
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      border: none;
    }
    button.pill {
      cursor: pointer;
      background: rgba(0, 122, 255, 0.85);
    }
  </style>
</head>
<body>
  <div id="controls">
    <span id="status" class="pill">Đang khởi động...</span>
    <button id="toggle-bg" class="pill">Nền: Camera</button>
  </div>

  <div id="stage">
    <canvas id="bg-canvas"></canvas>
    <canvas id="vrm-canvas"></canvas>
    <canvas id="person-canvas"></canvas>
  </div>
  <video id="video" playsinline autoplay muted></video>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/@pixiv/three-vrm@0.6.8/lib/three-vrm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

  <script>
    const statusEl = document.getElementById('status');
    const toggleBgBtn = document.getElementById('toggle-bg');
    const videoEl = document.getElementById('video');
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const vrmCanvas = document.getElementById('vrm-canvas');
    const personCanvas = document.getElementById('person-canvas');
    const personCtx = personCanvas.getContext('2d');

    // Canvas phụ để xử lý mask sắc nét hơn trước khi áp lên người
    const maskCanvas = document.createElement('canvas');
    const maskCtx = maskCanvas.getContext('2d');

    let showCameraBg = true; // true: hiện nền camera, false: nền trong suốt
    let isSegmenting = false;

    toggleBgBtn.addEventListener('click', () => {
      showCameraBg = !showCameraBg;
      toggleBgBtn.innerText = showCameraBg ? 'Nền: Camera' : 'Nền: Trong suốt';
      if (!showCameraBg) {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      }
    });

    // Vẽ ảnh/video/mask theo kiểu object-fit: cover để không bị méo/lệch
    function drawCover(ctx, source, targetW, targetH) {
      const sw = source.videoWidth || source.width;
      const sh = source.videoHeight || source.height;
      if (!sw || !sh || !targetW || !targetH) return;

      const scale = Math.max(targetW / sw, targetH / sh);
      const dw = sw * scale;
      const dh = sh * scale;
      const dx = (targetW - dw) * 0.5;
      const dy = (targetH - dh) * 0.5;
      ctx.drawImage(source, dx, dy, dw, dh);
    }

    // 1. Three.js (lớp giữa: nằm trên nền camera, dưới người/tay)
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 1.35, 1.8);

    const renderer = new THREE.WebGLRenderer({
      canvas: vrmCanvas,
      antialias: true,
      alpha: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.15);
    dirLight.position.set(1, 2, 2);
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.85));

    let currentVrm = null;
    new THREE.GLTFLoader().load(
      'model.vrm',
      (gltf) => {
        THREE.VRM.from(gltf).then((vrm) => {
          currentVrm = vrm;
          vrm.scene.position.set(0.15, 0.15, 0.2);
          vrm.scene.scale.set(0.95, 0.95, 0.95);
          vrm.scene.rotation.y = Math.PI;
          scene.add(vrm.scene);
          statusEl.innerText = 'Sẵn sàng';
        });
      },
      undefined,
      () => { statusEl.innerText = 'Lỗi tải model.vrm'; }
    );

    // 2. Selfie Segmentation (lớp trên cùng: tay & người đè lên nhân vật)
    const selfieSegmentation = new SelfieSegmentation({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
    });

    selfieSegmentation.setOptions({
      modelSelection: 1,
      selfieMode: false
    });

    selfieSegmentation.onResults((results) => {
      const w = personCanvas.width;
      const h = personCanvas.height;
      if (!w || !h) return;

      maskCanvas.width = w;
      maskCanvas.height = h;
      maskCtx.clearRect(0, 0, w, h);

      // Làm mượt nhẹ mask nhưng giữ độ nét để giảm bóng mờ viền
      maskCtx.filter = 'blur(2px)';
      drawCover(maskCtx, results.segmentationMask, w, h);
      maskCtx.filter = 'none';

      // Tăng độ tương phản mask để cắt bớt vùng bán trong suốt bị nhòe
      const imgData = maskCtx.getImageData(0, 0, w, h);
      const data = imgData.data;
      for (let i = 3; i < data.length; i += 4) {
        // Ngưỡng cắt: < 90 bỏ hẳn (xóa vệt mờ), > 180 rõ hẳn
        const a = data[i];
        if (a < 90) data[i] = 0;
        else if (a > 180) data[i] = 255;
        else data[i] = Math.round(((a - 90) / 90) * 255);
      }
      maskCtx.putImageData(imgData, 0, 0);

      personCtx.clearRect(0, 0, w, h);
      personCtx.save();
      drawCover(personCtx, results.image, w, h);
      personCtx.globalCompositeOperation = 'destination-in';
      personCtx.drawImage(maskCanvas, 0, 0);
      personCtx.restore();
    });

    // 3. Mở camera sau
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        videoEl.srcObject = stream;
        await videoEl.play();
        resizeAll();
        loop();
      } catch (err) {
        console.error(err);
        statusEl.innerText = 'Không mở được camera (kiểm tra quyền & HTTPS)';
      }
    }

    function resizeAll() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      bgCanvas.width = w;
      bgCanvas.height = h;
      personCanvas.width = w;
      personCanvas.height = h;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    window.addEventListener('resize', resizeAll);

    async function loop() {
      if (videoEl.readyState >= 2) {
        if (showCameraBg) {
          bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
          drawCover(bgCtx, videoEl, bgCanvas.width, bgCanvas.height);
        }

        if (!isSegmenting) {
          isSegmenting = true;
          try {
            await selfieSegmentation.send({ image: videoEl });
          } finally {
            isSegmenting = false;
          }
        }
      }

      if (currentVrm) {
        currentVrm.update(0.016);
      }
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    startCamera();
  </script>
</body>
</html>
