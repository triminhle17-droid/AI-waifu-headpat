<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>TikTok Style VRM Filter - RVM</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0b0f;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    #filter-frame {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      aspect-ratio: 9 / 16;
      max-height: 100vh;
      overflow: hidden;
      background: #000;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
    }

    @media (min-width: 600px) {
      #filter-frame {
        height: 92vh;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
    }

    #cam-canvas, #vrm-canvas, #person-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #cam-canvas { z-index: 1; pointer-events: none; }
    #vrm-canvas { z-index: 2; cursor: grab; }
    #vrm-canvas:active { cursor: grabbing; }
    #person-canvas { z-index: 3; pointer-events: none; }

    #video { display: none; }

    #top-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .badge {
      color: #fff;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(6px);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      max-width: 72%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #controls {
      position: absolute;
      right: 10px;
      bottom: 96px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      border: none;
      color: #fff;
      background: rgba(20, 20, 28, 0.75);
      backdrop-filter: blur(6px);
      padding: 8px 11px;
      border-radius: 13px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      white-space: nowrap;
    }

    .btn.active {
      background: #ff2b55;
      border-color: #ff2b55;
    }

    #bottom-bar {
      position: absolute;
      bottom: 16px;
      left: 10px;
      right: 10px;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div id="filter-frame">
    <div id="top-bar">
      <span id="status" class="badge">Khởi tạo...</span>
      <span class="badge">RVM + VRM Filter</span>
    </div>

    <canvas id="cam-canvas"></canvas>
    <canvas id="vrm-canvas"></canvas>
    <canvas id="person-canvas"></canvas>
    <video id="video" playsinline webkit-playsinline autoplay muted></video>

    <div id="controls">
      <button id="btn-cam" class="btn">Cam: Sau</button>
      <button id="btn-occ" class="btn active">Che người: BẬT</button>
      <button id="btn-drag-mode" class="btn">Kéo: Trái/Phải/Lên/Xuống</button>
      <button id="btn-expr" class="btn">Biểu cảm: Vui</button>
      <button id="btn-pose" class="btn">Tư thế: Đứng thẳng</button>
    </div>

    <div id="bottom-bar">
      <button id="btn-pos" class="btn">Vị trí: Giữa</button>
      <button id="btn-zoom-out" class="btn">Thu nhỏ (-)</button>
      <button id="btn-zoom-in" class="btn">Phóng to (+)</button>
      <button id="btn-reset" class="btn">Đặt lại</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/@pixiv/three-vrm@0.6.8/lib/three-vrm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/ort.min.js"></script>

  <script>
    const RVM_MODEL_URL = './rvm_mobilenetv3_fp32.onnx';
    const RVM_W = 288;
    const RVM_H = 384;

    const frameEl = document.getElementById('filter-frame');
    const statusEl = document.getElementById('status');
    const videoEl = document.getElementById('video');
    const camCanvas = document.getElementById('cam-canvas');
    const camCtx = camCanvas.getContext('2d');
    const vrmCanvas = document.getElementById('vrm-canvas');
    const personCanvas = document.getElementById('person-canvas');
    const personCtx = personCanvas.getContext('2d');

    const rvmInputCanvas = document.createElement('canvas');
    rvmInputCanvas.width = RVM_W;
    rvmInputCanvas.height = RVM_H;
    const rvmInputCtx = rvmInputCanvas.getContext('2d', { willReadFrequently: true });

    const matteCanvas = document.createElement('canvas');
    matteCanvas.width = RVM_W;
    matteCanvas.height = RVM_H;
    const matteCtx = matteCanvas.getContext('2d');
    const matteImgData = matteCtx.createImageData(RVM_W, RVM_H);

    const cutoutCanvas = document.createElement('canvas');
    cutoutCanvas.width = RVM_W;
    cutoutCanvas.height = RVM_H;
    const cutoutCtx = cutoutCanvas.getContext('2d');

    const btnCam = document.getElementById('btn-cam');
    const btnOcc = document.getElementById('btn-occ');
    const btnDragMode = document.getElementById('btn-drag-mode');
    const btnExpr = document.getElementById('btn-expr');
    const btnPose = document.getElementById('btn-pose');
    const btnPos = document.getElementById('btn-pos');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnReset = document.getElementById('btn-reset');

    let facingMode = 'environment';
    let occlusionEnabled = true;
    let isMatting = false;
    let isSwitchingCam = false;
    let currentVrm = null;

    let rvmSession = null;
    let rvmReady = false;
    let rvmStatusText = 'Đang nạp RVM...';
    let recStates = {
      r1i: new ort.Tensor('float32', new Float32Array(1), [1, 1, 1, 1]),
      r2i: new ort.Tensor('float32', new Float32Array(1), [1, 1, 1, 1]),
      r3i: new ort.Tensor('float32', new Float32Array(1), [1, 1, 1, 1]),
      r4i: new ort.Tensor('float32', new Float32Array(1), [1, 1, 1, 1])
    };
    const downsampleRatioTensor = new ort.Tensor('float32', new Float32Array([0.375]), [1]);

    function updateStatus() {
      const camLabel = facingMode === 'environment' ? 'Cam sau' : 'Cam trước';
      statusEl.innerText = `${camLabel} • ${rvmStatusText}`;
    }

    function resetRecurrentStates() {
      recStates = {
        r1i: new ort.Tensor('float32', new Float32Array(1), [1, 1, 1, 1]),
        r2i: new ort.Tensor('float32', new Float32Array(1), [1, 1, 1, 1]),
        r3i: new ort.Tensor('float32', new Float32Array(1), [1, 1, 1, 1]),
        r4i: new ort.Tensor('float32', new Float32Array(1), [1, 1, 1, 1])
      };
    }

    const presets = [
      { label: 'Giữa', x: 0.0, y: 0.12, z: -0.15 },
      { label: 'Sau phải', x: 0.28, y: 0.14, z: -0.35 },
      { label: 'Sau trái', x: -0.28, y: 0.14, z: -0.35 }
    ];
    let presetIdx = 0;
    let modelPos = { x: presets[0].x, y: presets[0].y, z: presets[0].z };
    let modelScale = 0.72;
    let dragMode = 'xy';

    const expressions = [
      { label: 'Vui', name: THREE.VRMSBlendShapePresetName ? THREE.VRMSBlendShapePresetName.Joy : 'joy' },
      { label: 'Cười nham hiểm', name: 'fun' },
      { label: 'Ngạc nhiên', name: 'surprised' },
      { label: 'Bình thường', name: 'neutral' }
    ];
    let exprIdx = 0;

    const poses = ['Đứng thẳng', 'Chào tay', 'Tay hông'];
    let poseIdx = 0;

    function applyModelTransform() {
      if (!currentVrm) return;
      currentVrm.scene.position.set(modelPos.x, modelPos.y, modelPos.z);
      currentVrm.scene.scale.set(modelScale, modelScale, modelScale);
    }

    function applyExpression() {
      if (!currentVrm || !currentVrm.blendShapeProxy) return;
      const proxy = currentVrm.blendShapeProxy;
      expressions.forEach((e) => {
        if (e.name) proxy.setValue(e.name, 0);
      });
      const current = expressions[exprIdx];
      if (current.name && current.name !== 'neutral') {
        proxy.setValue(current.name, 1.0);
      }
      proxy.update();
    }

    function resetPoseBones() {
      if (!currentVrm || !currentVrm.humanoid) return;
      const boneNames = [
        THREE.VRMSchema.HumanoidBoneName.LeftUpperArm,
        THREE.VRMSchema.HumanoidBoneName.LeftLowerArm,
        THREE.VRMSchema.HumanoidBoneName.RightUpperArm,
        THREE.VRMSchema.HumanoidBoneName.RightLowerArm
      ];
      boneNames.forEach((b) => {
        const node = currentVrm.humanoid.getBoneNode(b);
        if (node) node.rotation.set(0, 0, 0);
      });
    }

    function applyPose(timeSec = 0) {
      if (!currentVrm || !currentVrm.humanoid) return;
      resetPoseBones();

      const lUpper = currentVrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName.LeftUpperArm);
      const lLower = currentVrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName.LeftLowerArm);
      const rUpper = currentVrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName.RightUpperArm);
      const rLower = currentVrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName.RightLowerArm);

      if (poseIdx === 1) {
        if (rUpper) { rUpper.rotation.z = -2.35; rUpper.rotation.x = 0.25; }
        if (rLower) { rLower.rotation.z = -0.45 + Math.sin(timeSec * 6) * 0.25; }
        if (lUpper) { lUpper.rotation.z = 0.2; }
      } else if (poseIdx === 2) {
        if (lUpper) { lUpper.rotation.z = 0.65; lUpper.rotation.x = -0.2; }
        if (lLower) { lLower.rotation.y = 1.25; }
        if (rUpper) { rUpper.rotation.z = -0.65; rUpper.rotation.x = -0.2; }
        if (rLower) { rLower.rotation.y = -1.25; }
      } else {
        if (lUpper) { lUpper.rotation.z = 0.15; }
        if (rUpper) { rUpper.rotation.z = -0.15; }
      }
    }

    function drawCover(ctx, source, w, h, mirror = false) {
      const sw = source.videoWidth || source.width;
      const sh = source.videoHeight || source.height;
      if (!sw || !sh || !w || !h) return;

      const scale = Math.max(w / sw, h / sh);
      const dw = sw * scale;
      const dh = sh * scale;
      const dx = (w - dw) * 0.5;
      const dy = (h - dh) * 0.5;

      ctx.save();
      if (mirror) {
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(source, dx, dy, dw, dh);
      ctx.restore();
    }

    async function initRVM() {
      rvmStatusText = 'Đang nạp RVM...';
      updateStatus();
      try {
        ort.env.wasm.numThreads = 1;
        rvmSession = await ort.InferenceSession.create(RVM_MODEL_URL, {
          executionProviders: ['wasm', 'webgl']
        });
        rvmReady = true;
        rvmStatusText = 'RVM OK';
      } catch (err) {
        rvmReady = false;
        rvmStatusText = 'RVM lỗi: ' + (err && err.message ? err.message.slice(0, 32) : 'tải thất bại');
      }
      updateStatus();
    }

    function canvasToNCHWTensor(ctx, w, h) {
      const imgData = ctx.getImageData(0, 0, w, h).data;
      const floatData = new Float32Array(3 * w * h);
      const planeSize = w * h;

      for (let i = 0; i < planeSize; i++) {
        const px = i * 4;
        floatData[i] = imgData[px] / 255;
        floatData[planeSize + i] = imgData[px + 1] / 255;
        floatData[planeSize * 2 + i] = imgData[px + 2] / 255;
      }

      return new ort.Tensor('float32', floatData, [1, 3, h, w]);
    }

    function pickAlphaTensor(results) {
      if (results.pha && results.pha.data) return results.pha;
      const pixelCount = RVM_W * RVM_H;
      for (const key of Object.keys(results)) {
        const t = results[key];
        if (t && t.data && t.data.length === pixelCount && !key.startsWith('r')) {
          return t;
        }
      }
      return null;
    }

    async function runRVMSegmentation(isMirror) {
      if (!rvmReady || !rvmSession || !occlusionEnabled) return;

      rvmInputCtx.clearRect(0, 0, RVM_W, RVM_H);
      drawCover(rvmInputCtx, videoEl, RVM_W, RVM_H, isMirror);

      const srcTensor = canvasToNCHWTensor(rvmInputCtx, RVM_W, RVM_H);

      const feeds = {
        src: srcTensor,
        r1i: recStates.r1i,
        r2i: recStates.r2i,
        r3i: recStates.r3i,
        r4i: recStates.r4i,
        downsample_ratio: downsampleRatioTensor
      };

      let results;
      try {
        results = await rvmSession.run(feeds);
      } catch (err) {
        rvmStatusText = 'Run lỗi: ' + (err && err.message ? err.message.slice(0, 30) : 'fail');
        updateStatus();
        return;
      }

      if (results.r1o) recStates.r1i = results.r1o;
      if (results.r2o) recStates.r2i = results.r2o;
      if (results.r3o) recStates.r3i = results.r3o;
      if (results.r4o) recStates.r4i = results.r4o;

      const alphaTensor = pickAlphaTensor(results);
      if (!alphaTensor || !alphaTensor.data) return;

      const alphaData = alphaTensor.data;
      const outPixels = matteImgData.data;
      const total = RVM_W * RVM_H;

      let maxVal = 0;
      for (let i = 0; i < total; i += 16) {
        if (alphaData[i] > maxVal) maxVal = alphaData[i];
      }
      const scaleDiv = maxVal > 1.5 ? 255 : 1;

      for (let i = 0; i < total; i++) {
        let a = (alphaData[i] || 0) / scaleDiv;
        if (a < 0.03) a = 0;
        else if (a > 0.7) a = 1;
        const alphaByte = Math.max(0, Math.min(255, Math.round(a * 255)));

        const idx = i * 4;
        outPixels[idx] = 255;
        outPixels[idx + 1] = 255;
        outPixels[idx + 2] = 255;
        outPixels[idx + 3] = alphaByte;
      }
      matteCtx.putImageData(matteImgData, 0, 0);

      cutoutCtx.clearRect(0, 0, RVM_W, RVM_H);
      cutoutCtx.save();
      cutoutCtx.drawImage(rvmInputCanvas, 0, 0, RVM_W, RVM_H);
      cutoutCtx.globalCompositeOperation = 'destination-in';
      cutoutCtx.drawImage(matteCanvas, 0, 0, RVM_W, RVM_H);
      cutoutCtx.restore();

      const w = personCanvas.width;
      const h = personCanvas.height;
      if (!w || !h) return;

      personCtx.clearRect(0, 0, w, h);
      personCtx.save();
      personCtx.imageSmoothingEnabled = true;
      personCtx.imageSmoothingQuality = 'high';
      personCtx.drawImage(cutoutCanvas, 0, 0, w, h);
      personCtx.restore();
    }

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 9 / 16, 0.1, 50);
    camera.position.set(0, 1.35, 1.9);

    const renderer = new THREE.WebGLRenderer({
      canvas: vrmCanvas,
      antialias: true,
      alpha: true
    });

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.15);
    dirLight.position.set(1, 2, 2);
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.85));

    new THREE.GLTFLoader().load(
      'model.vrm',
      (gltf) => {
        THREE.VRM.from(gltf).then((vrm) => {
          currentVrm = vrm;
          vrm.scene.rotation.y = Math.PI;
          applyModelTransform();
          applyExpression();
          applyPose(0);
          scene.add(vrm.scene);
        });
      },
      undefined,
      () => {
        rvmStatusText = 'Lỗi model.vrm';
        updateStatus();
      }
    );

    let isDragging = false;
    let lastX = 0;
    let lastY = 0;

    vrmCanvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || !currentVrm) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;

      if (dragMode === 'xy') {
        modelPos.x = Math.max(-1.2, Math.min(1.2, modelPos.x + dx * 0.004));
        modelPos.y = Math.max(-0.8, Math.min(1.0, modelPos.y - dy * 0.004));
      } else {
        modelPos.z = Math.max(-1.5, Math.min(1.0, modelPos.z - dy * 0.005));
      }
      applyModelTransform();
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });

    async function startCamera() {
      if (isSwitchingCam) return;
      isSwitchingCam = true;
      resetRecurrentStates();
      updateStatus();

      if (videoEl.srcObject) {
        videoEl.srcObject.getTracks().forEach((track) => track.stop());
        videoEl.srcObject = null;
      }

      const constraintsList =
        facingMode === 'environment'
          ? [
              { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
              { video: { facingMode: 'environment' }, audio: false },
              { video: true, audio: false }
            ]
          : [
              { video: { facingMode: { ideal: 'user' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
              { video: { facingMode: 'user' }, audio: false }
            ];

      let opened = false;
      for (const constraints of constraintsList) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          videoEl.srcObject = stream;
          try {
            await videoEl.play();
          } catch (_) {
            // Safari đôi khi phát tự động qua autoplay + muted
          }
          resizeFrame();
          opened = true;
          break;
        } catch (err) {
          console.warn('Thử camera thất bại:', err);
        }
      }

      if (!opened) {
        rvmStatusText = 'Không mở được cam';
      }

      isSwitchingCam = false;
      updateStatus();
    }

    function resizeFrame() {
      const rect = frameEl.getBoundingClientRect();
      const w = Math.max(1, Math.floor(rect.width));
      const h = Math.max(1, Math.floor(rect.height));

      camCanvas.width = w;
      camCanvas.height = h;
      personCanvas.width = w;
      personCanvas.height = h;

      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(w, h);
    }

    window.addEventListener('resize', resizeFrame);

    btnCam.addEventListener('click', () => {
      if (isSwitchingCam) return;
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      btnCam.innerText = facingMode === 'environment' ? 'Cam: Sau' : 'Cam: Trước';
      startCamera();
    });

    btnOcc.addEventListener('click', () => {
      occlusionEnabled = !occlusionEnabled;
      btnOcc.classList.toggle('active', occlusionEnabled);
      btnOcc.innerText = occlusionEnabled ? 'Che người: BẬT' : 'Che người: TẮT';
      if (!occlusionEnabled) {
        personCtx.clearRect(0, 0, personCanvas.width, personCanvas.height);
        resetRecurrentStates();
      }
    });

    btnDragMode.addEventListener('click', () => {
      dragMode = dragMode === 'xy' ? 'z' : 'xy';
      btnDragMode.classList.toggle('active', dragMode === 'z');
      btnDragMode.innerText = dragMode === 'xy' ? 'Kéo: Trái/Phải/Lên/Xuống' : 'Kéo: Tới/Lui (Z)';
    });

    btnExpr.addEventListener('click', () => {
      exprIdx = (exprIdx + 1) % expressions.length;
      btnExpr.innerText = `Biểu cảm: ${expressions[exprIdx].label}`;
      applyExpression();
    });

    btnPose.addEventListener('click', () => {
      poseIdx = (poseIdx + 1) % poses.length;
      btnPose.innerText = `Tư thế: ${poses[poseIdx]}`;
      applyPose(performance.now() * 0.001);
    });

    btnPos.addEventListener('click', () => {
      presetIdx = (presetIdx + 1) % presets.length;
      const p = presets[presetIdx];
      modelPos = { x: p.x, y: p.y, z: p.z };
      btnPos.innerText = `Vị trí: ${p.label}`;
      applyModelTransform();
    });

    btnZoomIn.addEventListener('click', () => {
      modelScale = Math.min(1.8, +(modelScale + 0.1).toFixed(2));
      applyModelTransform();
    });

    btnZoomOut.addEventListener('click', () => {
      modelScale = Math.max(0.35, +(modelScale - 0.1).toFixed(2));
      applyModelTransform();
    });

    btnReset.addEventListener('click', () => {
      presetIdx = 0;
      modelPos = { x: presets[0].x, y: presets[0].y, z: presets[0].z };
      modelScale = 0.72;
      exprIdx = 0;
      poseIdx = 0;
      btnPos.innerText = `Vị trí: ${presets[0].label}`;
      btnExpr.innerText = `Biểu cảm: ${expressions[0].label}`;
      btnPose.innerText = `Tư thế: ${poses[0]}`;
      applyModelTransform();
      applyExpression();
      applyPose(0);
    });

    async function loop() {
      const nowSec = performance.now() * 0.001;

      if (!isSwitchingCam && videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
        const isMirror = facingMode === 'user';
        camCtx.clearRect(0, 0, camCanvas.width, camCanvas.height);
        drawCover(camCtx, videoEl, camCanvas.width, camCanvas.height, isMirror);

        if (occlusionEnabled && rvmReady && !isMatting) {
          isMatting = true;
          try {
            await runRVMSegmentation(isMirror);
          } catch (e) {
            console.warn('RVM frame error:', e);
          } finally {
            isMatting = false;
          }
        }
      }

      if (currentVrm) {
        if (poseIdx === 1) {
          applyPose(nowSec);
        }
        currentVrm.update(0.016);
      }

      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    resizeFrame();
    startCamera();
    initRVM();
    loop();
  </script>
</body>
</html>
