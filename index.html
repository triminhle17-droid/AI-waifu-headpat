<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Front Cam VRM Behind Person</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: sans-serif;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #vrm-canvas, #person-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #vrm-canvas {
      z-index: 1;
    }
    #person-canvas {
      z-index: 2;
      pointer-events: none;
    }
    #video {
      display: none;
    }
    #status {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="status">Đang bật camera trước...</div>
  <div id="stage">
    <canvas id="vrm-canvas"></canvas>
    <canvas id="person-canvas"></canvas>
  </div>
  <video id="video" playsinline autoplay muted></video>

  <!-- Three.js + Three-VRM -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/@pixiv/three-vrm@0.6.8/lib/three-vrm.js"></script>

  <!-- MediaPipe Selfie Segmentation -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

  <script>
    const statusEl = document.getElementById('status');
    const videoEl = document.getElementById('video');
    const vrmCanvas = document.getElementById('vrm-canvas');
    const personCanvas = document.getElementById('person-canvas');
    const personCtx = personCanvas.getContext('2d');

    // 1. Three.js: mô hình nằm ở lớp sau (z-index: 1)
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 1.35, 1.8);

    const renderer = new THREE.WebGLRenderer({
      canvas: vrmCanvas,
      antialias: true,
      alpha: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.15);
    dirLight.position.set(1, 2, 2);
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.85));

    let currentVrm = null;
    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.load(
      'model.vrm',
      (gltf) => {
        THREE.VRM.from(gltf).then((vrm) => {
          currentVrm = vrm;
          // Đặt gần vừa tầm để dễ đưa tay vào trước mặt/đầu nhân vật
          vrm.scene.position.set(0.15, 0.15, 0.2);
          vrm.scene.scale.set(0.95, 0.95, 0.95);
          vrm.scene.rotation.y = Math.PI;
          scene.add(vrm.scene);
          statusEl.innerText = 'Cam trước sẵn sàng — đưa tay lên trước nhân vật';
        });
      },
      undefined,
      (err) => {
        console.error(err);
        statusEl.innerText = 'Lỗi tải model.vrm';
      }
    );

    // 2. Selfie Segmentation: tách người/tay nằm ở lớp trên (z-index: 2)
    const selfieSegmentation = new SelfieSegmentation({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
    });

    selfieSegmentation.setOptions({
      modelSelection: 1,
      selfieMode: false // Tự lật gương trên canvas để kiểm soát mượt và đúng chiều
    });

    selfieSegmentation.onResults((results) => {
      const w = personCanvas.width;
      const h = personCanvas.height;
      if (!w || !h) return;

      personCtx.save();
      personCtx.clearRect(0, 0, w, h);

      // Lật ngang theo kiểu gương soi cho camera trước
      personCtx.translate(w, 0);
      personCtx.scale(-1, 1);

      personCtx.filter = 'blur(1.5px)';
      personCtx.drawImage(results.segmentationMask, 0, 0, w, h);
      personCtx.filter = 'none';

      // Chỉ giữ phần người & tay thật đè lên mô hình VRM
      personCtx.globalCompositeOperation = 'source-in';
      personCtx.drawImage(results.image, 0, 0, w, h);

      personCtx.restore();
    });

    // 3. Mở camera trước (facingMode: 'user')
    async function startFrontCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'user' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        videoEl.srcObject = stream;
        await videoEl.play();

        resizeCanvases();
        loop();
      } catch (err) {
        console.error(err);
        statusEl.innerText = 'Không mở được cam trước (kiểm tra quyền & HTTPS)';
      }
    }

    function resizeCanvases() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      personCanvas.width = w;
      personCanvas.height = h;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    window.addEventListener('resize', resizeCanvases);

    async function loop() {
      if (videoEl.readyState >= 2) {
        await selfieSegmentation.send({ image: videoEl });
      }
      if (currentVrm) {
        currentVrm.update(0.016);
      }
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    startFrontCamera();
  </script>
</body>
</html>
