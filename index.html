<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR VRM Floor Placement</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #info {
            position: absolute; top: 20px; width: 100%; text-align: center;
            color: white; font-size: 16px; pointer-events: none;
            text-shadow: 1px 1px 3px black; z-index: 10;
        }
        #ar-button {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            padding: 12px 24px; background: #007aff; color: white; border: none;
            border-radius: 25px; font-size: 18px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">Nhấn nút bên dưới để khởi động AR</div>
    <button id="ar-button">BẮT ĐẦU AR</button>

    <!-- Thư viện Three.js & VRM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/@pixiv/three-vrm@0.6.8/lib/three-vrm.js"></script>

    <script type="module">
        import { ARButton } from 'https://unpkg.com/three@0.128.0/examples/jsm/webxr/ARButton.js';

        let container;
        let camera, scene, renderer;
        let currentVrm = null;
        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        let controller;

        init();
        animate();

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true; // Bật chế độ WebXR
            container.appendChild(renderer.domElement);

            // Ánh sáng
            const light = new THREE.DirectionalLight(0xffffff, Math.PI);
            light.position.set(1, 2, 1).normalize();
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));

            // Tải file mô hình model.vrm trước
            const loader = new THREE.GLTFLoader();
            loader.load('model.vrm', (gltf) => {
                THREE.VRM.from(gltf).then((vrm) => {
                    currentVrm = vrm;
                    // Chưa đưa vào scene vội, khi nào bấm màn hình mới đặt xuống vị trí vòng tròn AR
                });
            }, undefined, (error) => {
                console.error('Lỗi tải VRM:', error);
            });

            // Tạo vòng tròn định vị mặt đất (Reticle) giống như trong video mẫu
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(- Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // Thiết lập nút AR Button của WebXR
            const arButtonOptions = {
                requiredFeatures: ['hit-test'], // Yêu cầu tính năng quét mặt phẳng
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.body }
            };

            document.body.appendChild(ARButton.createButton(renderer, arButtonOptions));

            // Bắt sự kiện chạm màn hình điện thoại để đặt mô hình xuống sàn
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            window.addEventListener('resize', onWindowResize, false);
        }

        // Khi người dùng chạm màn hình điện thoại
        function onSelect() {
            if (reticle.visible && currentVrm) {
                // Đưa mô hình vào vị trí vòng tròn đang quét được trên mặt đất
                scene.add(currentVrm.scene);
                currentVrm.scene.position.setFromMatrixPosition(reticle.matrix);
                currentVrm.scene.quaternion.setFromRotationMatrix(reticle.matrix);
                
                // Ẩn vòng tròn định vị đi sau khi đã đặt nhân vật xuống
                reticle.visible = false;
                document.getElementById('info').innerText = 'Đã đặt nhân vật xuống sàn!';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (!hitTestSourceRequested) {
                    session.requestReferenceSpace('viewer').then((referenceSpace) => {
                        session.requestHitTestSource({ space: referenceSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', () => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                        reticle.visible = false;
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            if (currentVrm) {
                currentVrm.update(0.016);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
