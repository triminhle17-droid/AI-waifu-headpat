<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>VRM Layer Behind Me</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #vrm-canvas, #person-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #vrm-canvas {
      z-index: 1;
    }
    #person-canvas {
      z-index: 2;
      pointer-events: none;
    }
    #video {
      display: none;
    }
    #status {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      padding: 6px 14px;
      border-radius: 999px;
      font-family: sans-serif;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="status">Đang khởi động camera &amp; tách nền...</div>
  <div id="stage">
    <canvas id="vrm-canvas"></canvas>
    <canvas id="person-canvas"></canvas>
  </div>
  <video id="video" playsinline autoplay muted></video>

  <!-- Three.js + Three-VRM -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/@pixiv/three-vrm@0.6.8/lib/three-vrm.js"></script>

  <!-- MediaPipe Selfie Segmentation -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

  <script>
    const statusEl = document.getElementById('status');
    const videoEl = document.getElementById('video');
    const vrmCanvas = document.getElementById('vrm-canvas');
    const personCanvas = document.getElementById('person-canvas');
    const personCtx = personCanvas.getContext('2d');

    // Canvas tạm để xử lý mask mượt hơn
    const maskCanvas = document.createElement('canvas');
    const maskCtx = maskCanvas.getContext('2d');

    // 1. Khởi tạo Three.js cho mô hình nằm ở lớp sau
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
    camera.position.set(0, 1.35, 2.4);

    const renderer = new THREE.WebGLRenderer({
      canvas: vrmCanvas,
      antialias: true,
      alpha: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(1, 2, 2);
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.85));

    let currentVrm = null;
    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.load(
      'model.vrm',
      (gltf) => {
        THREE.VRM.from(gltf).then((vrm) => {
          currentVrm = vrm;
          // Đặt mô hình lùi về sau và hơi lệch sang một bên giống ảnh mẫu
          vrm.scene.position.set(0.35, 0, -0.4);
          vrm.scene.scale.set(0.9, 0.9, 0.9);
          vrm.scene.rotation.y = Math.PI;
          scene.add(vrm.scene);
          statusEl.innerText = 'Layer: behind me (Sẵn sàng)';
        });
      },
      undefined,
      (err) => {
        console.error(err);
        statusEl.innerText = 'Lỗi tải model.vrm';
      }
    );

    // 2. Khởi tạo Selfie Segmentation
    const selfieSegmentation = new SelfieSegmentation({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
    });

    selfieSegmentation.setOptions({
      modelSelection: 1, // 1 = landscape/general mượt hơn trên nhiều máy
      selfieMode: true
    });

    selfieSegmentation.onResults((results) => {
      const w = personCanvas.width;
      const h = personCanvas.height;
      if (!w || !h) return;

      maskCanvas.width = w;
      maskCanvas.height = h;

      personCtx.save();
      personCtx.clearRect(0, 0, w, h);

      // Làm mềm viền nhẹ giống "Edges: soft"
      personCtx.filter = 'blur(1.5px)';
      personCtx.drawImage(results.segmentationMask, 0, 0, w, h);
      personCtx.filter = 'none';

      // Giữ lại phần người thật (nơi mask có màu trắng)
      personCtx.globalCompositeOperation = 'source-in';
      personCtx.drawImage(results.image, 0, 0, w, h);

      personCtx.restore();
    });

    // 3. Mở camera
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        videoEl.srcObject = stream;
        await videoEl.play();

        resizeCanvases();
        processLoop();
      } catch (err) {
        console.error(err);
        statusEl.innerText = 'Không mở được camera (kiểm tra quyền & HTTPS)';
      }
    }

    function resizeCanvases() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      personCanvas.width = w;
      personCanvas.height = h;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    window.addEventListener('resize', resizeCanvases);

    async function processLoop() {
      if (videoEl.readyState >= 2) {
        await selfieSegmentation.send({ image: videoEl });
      }
      if (currentVrm) {
        currentVrm.update(0.016);
      }
      renderer.render(scene, camera);
      requestAnimationFrame(processLoop);
    }

    startCamera();
  </script>
</body>
</html>
