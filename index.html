<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>VRM Filter - Hybrid WebXR & iOS AR</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #0b0b0f; font-family: sans-serif;
      display: flex; align-items: center; justify-content: center; touch-action: none;
    }
    #filter-frame {
      position: relative; width: 100vw; height: 100vh;
      max-width: 480px; aspect-ratio: 9 / 16; max-height: 100vh;
      overflow: hidden; background: #000; box-shadow: 0 12px 40px rgba(0,0,0,.7);
    }
    @media (min-width: 600px) {
      #filter-frame { height: 92vh; border-radius: 22px; border: 1px solid rgba(255,255,255,.12); }
    }
    /* Bắt buộc trong suốt khi chạy WebXR để camera ARKit/ARCore phía dưới không bị che đen */
    html.xr-active, html.xr-active body, html.xr-active #filter-frame {
      background: transparent !important;
      box-shadow: none !important;
      border: none !important;
      max-width: 100vw !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    #cam-canvas, #vrm-canvas, #person-canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
    }
    #cam-canvas { z-index: 1; pointer-events: none; }
    #vrm-canvas { z-index: 2; cursor: grab; background: transparent !important; }
    #vrm-canvas:active { cursor: grabbing; }
    #person-canvas { z-index: 3; pointer-events: none; }
    #video { display: none; }

    #top-bar {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10;
      display: flex; justify-content: space-between; align-items: center; gap: 8px; pointer-events: none;
    }
    .badge {
      color: #fff; background: rgba(0,0,0,.68); padding: 6px 12px;
      border-radius: 999px; font-size: 12px; max-width: 72%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #status { pointer-events: auto; white-space: normal; line-height: 1.35; border-radius: 16px; }
    #hint {
      position: absolute; top: 68px; left: 14px; right: 14px; z-index: 10;
      text-align: center; color: #fff; font-size: 13px; line-height: 1.35;
      text-shadow: 0 1px 3px #000; pointer-events: none;
    }
    .ui-hidden #controls, .ui-hidden #bottom-bar .btn:not(#btn-ui) { display: none; }
    .ui-hidden #btn-ui { opacity: .55; }
    #controls {
      position: absolute; right: 10px; bottom: 96px; z-index: 10;
      display: flex; flex-direction: column; gap: 8px;
    }
    .btn {
      color: #fff; background: rgba(20,20,28,.75); padding: 8px 11px;
      border-radius: 13px; font-size: 11.5px; font-weight: 600; cursor: pointer;
      border: 1px solid rgba(255,255,255,.15); text-align: center; white-space: nowrap;
    }
    .btn.active { background: #ff2b55; border-color: #ff2b55; }
    #bottom-bar {
      position: absolute; bottom: 16px; left: 10px; right: 10px; z-index: 10;
      display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    }
    #ARButton { display: none !important; }
  </style>
</head>
<body>
  <div id="filter-frame">
    <div id="top-bar">
      <span id="status" class="badge">Khởi tạo...</span>
      <span id="mode-badge" class="badge">VRM AR Hybrid</span>
    </div>

    <div id="hint"></div>
    <canvas id="cam-canvas"></canvas>
    <canvas id="vrm-canvas"></canvas>
    <canvas id="person-canvas"></canvas>
    <video id="video" playsinline webkit-playsinline autoplay muted></video>

    <div id="controls">
      <button id="btn-cam" class="btn">Cam: Sau</button>
      <button id="btn-occ" class="btn active">Che người: BẬT</button>
      <button id="btn-drag-mode" class="btn">Kéo: Trái/Phải/Lên/Xuống</button>
      <button id="btn-expr" class="btn">Biểu cảm: Vui</button>
      <button id="btn-pose" class="btn">Tư thế: Đứng thẳng</button>
      <button id="btn-engine" class="btn">Tách: Tay</button>
      <button id="btn-ar" class="btn">AR sàn: TẮT</button>
      <button id="btn-height" class="btn" style="display:none">Độ cao máy: 1.4m</button>
    </div>

    <div id="bottom-bar">
      <button id="btn-pos" class="btn">Vị trí: Giữa</button>
      <button id="btn-zoom-out" class="btn">Thu nhỏ (-)</button>
      <button id="btn-zoom-in" class="btn">Phóng to (+)</button>
      <button id="btn-reset" class="btn">Đặt lại</button>
      <button id="btn-ui" class="btn">Ẩn nút</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://unpkg.com/@pixiv/three-vrm@0.6.8/lib/three-vrm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/ort.min.js"></script>

  <script type="module">
    import { ARButton } from 'https://unpkg.com/three@0.128.0/examples/jsm/webxr/ARButton.js';

    const RVM_MODEL_URL = './rvm_mobilenetv3_fp32.onnx';
    const RVM_TIERS = [[108, 192, 0.8], [144, 256, 0.6], [180, 320, 0.5], [216, 384, 0.5], [270, 480, 0.4]];
    const AUTO_TIER = true;
    const RENDER_FPS_CAP = 30;
    const DEFAULT_ENGINE = 'hand';
    const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
    const HAND_W = 216, HAND_H = 384;
    const ENGINES = ['hand', 'mediapipe', 'rvm'];
    const ENGINE_LABEL = { hand: 'Tách: Tay', mediapipe: 'Tách: Người', rvm: 'Tách: RVM' };
    const MP_W = 144, MP_H = 256;
    const MP_MODEL = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
    const MP_BUNDLES = [
      ['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs', 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'],
      ['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs', 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm']
    ];

    let engine = DEFAULT_ENGINE;
    let tier = 2;
    let RVM_W = RVM_TIERS[tier][0], RVM_H = RVM_TIERS[tier][1], RVM_RATIO = RVM_TIERS[tier][2];
    const ALPHA_LO = 0.25, ALPHA_HI = 0.65;
    const RVM_USE_WORKER = true;
    const ARM_SIGN = 1;

    const frameEl = document.getElementById('filter-frame');
    const statusEl = document.getElementById('status');
    const modeBadgeEl = document.getElementById('mode-badge');
    const videoEl = document.getElementById('video');
    const camCanvas = document.getElementById('cam-canvas');
    const camCtx = camCanvas.getContext('2d');
    const vrmCanvas = document.getElementById('vrm-canvas');
    const personCanvas = document.getElementById('person-canvas');
    const personCtx = personCanvas.getContext('2d');
    const hintEl = document.getElementById('hint');

    function makeCanvas(w, h, opts) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      return [c, c.getContext('2d', opts)];
    }
    const [rvmInputCanvas, rvmInputCtx] = makeCanvas(RVM_W, RVM_H, { willReadFrequently: true });
    const [matteCanvas, matteCtx] = makeCanvas(RVM_W, RVM_H);
    let matteImgData = matteCtx.createImageData(RVM_W, RVM_H);

    const btnCam = document.getElementById('btn-cam');
    const btnOcc = document.getElementById('btn-occ');
    const btnDragMode = document.getElementById('btn-drag-mode');
    const btnExpr = document.getElementById('btn-expr');
    const btnPose = document.getElementById('btn-pose');
    const btnPos = document.getElementById('btn-pos');
    const btnZoomOut = document.getElementById('btn-zoom-out');
    const btnZoomIn = document.getElementById('btn-zoom-in');
    const btnReset = document.getElementById('btn-reset');
    const btnEngine = document.getElementById('btn-engine');
    const btnAr = document.getElementById('btn-ar');
    const btnHeight = document.getElementById('btn-height');
    const btnUi = document.getElementById('btn-ui');

    let facingMode = 'environment';
    let occlusionEnabled = true;
    let isSwitchingCam = false;
    let matteFresh = false;
    let currentVrm = null;

    let rvmSession = null, rvmWorker = null, rvmModelBytes = null;
    let handLm = null, handReady = false, handDelegate = '', mpMod = null, mpFileset = null;
    let mpSegmenter = null, mpReady = false, mpDelegate = '', mpLabels = [], mpLastTs = 0, engineSwitching = false, matteLoopStarted = false;
    let rvmReady = false;
    let rvmStatusText = 'Đang nạp...';
    let rvmFullMsg = '';
    let maskFps = 0, fpsCount = 0, fpsT = performance.now(), uiFps = 0, uiCount = 0;
    let aiMs = 0, iterTimes = [], tierCooldown = 3, tierCeil = RVM_TIERS.length - 1;

    // ===== TRẠNG THÁI HYBRID AR =====
    let webxrSupported = false;
    let arActiveMode = 'none'; // 'none' | 'webxr' | 'ios'
    let arPlaced = false;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let arButtonEl = null;
    let hintTimer = null;

    const AR_FOV = 60;
    const AR_HEIGHTS = [1.0, 1.2, 1.4, 1.6];
    let arHeightIdx = 2, arAlpha0 = null, arLastEvt = 0, savedScale = 0.6;
    let arYaw = Math.PI, arCamY = 1.4;
    const arPos = new THREE.Vector3();
    const arDir = new THREE.Vector3();
    const arTarget = new THREE.Quaternion();
    const arEuler = new THREE.Euler();
    const arQ1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
    const arQ0 = new THREE.Quaternion();
    const arZ = new THREE.Vector3(0, 0, 1);
    const arQuat = new THREE.Quaternion();
    const orientHist = [];

    function hint(text, ms = 3500) {
      hintEl.innerText = text || '';
      clearTimeout(hintTimer);
      if (text && ms > 0) hintTimer = setTimeout(() => { hintEl.innerText = ''; }, ms);
    }

    const emptyState = () => new ort.Tensor('float32', new Float32Array(1), [1, 1, 1, 1]);
    let recStates = { r1i: emptyState(), r2i: emptyState(), r3i: emptyState(), r4i: emptyState() };

    function resetRecurrentStates() {
      recStates = { r1i: emptyState(), r2i: emptyState(), r3i: emptyState(), r4i: emptyState() };
      if (rvmWorker) rvmWorker.postMessage({ type: 'reset' });
    }

    function updateStatus() {
      const camLabel = facingMode === 'environment' ? 'Cam sau' : 'Cam trước';
      const extra = !engineReady() || !maskFps || arActiveMode === 'webxr' ? '' : engine === 'rvm'
        ? ` • mặt nạ ${maskFps}fps • AI ${aiMs}ms • ${RVM_H}p • UI ${uiFps}fps`
        : ` • mặt nạ ${maskFps}fps • UI ${uiFps}fps`;
      const arLabel = arActiveMode === 'webxr'
        ? ' • WebXR 6DoF'
        : arActiveMode === 'ios'
          ? ` • iOS AR (${arCamY.toFixed(1)}m)`
          : '';
      statusEl.innerText = `${camLabel} • ${rvmStatusText}${extra}${arLabel}`;
    }
    statusEl.addEventListener('click', () => { if (rvmFullMsg) alert(rvmFullMsg); });

    const presets = [
      { label: 'Giữa', x: 0.0, y: 0.12, z: -0.15 },
      { label: 'Sau phải', x: 0.28, y: 0.14, z: -0.35 },
      { label: 'Sau trái', x: -0.28, y: 0.14, z: -0.35 }
    ];
    let presetIdx = 0;
    let modelPos = { x: presets[0].x, y: presets[0].y, z: presets[0].z };
    let modelScale = 0.6;
    let dragMode = 'xy';

    const expressions = [
      { label: 'Vui', name: 'joy' },
      { label: 'Cười nham hiểm', name: 'fun' },
      { label: 'Ngạc nhiên', name: 'surprised' },
      { label: 'Bình thường', name: 'neutral' }
    ];
    let exprIdx = 0;

    const poses = ['Đứng thẳng', 'Chào tay', 'Tay hông'];
    let poseIdx = 0;

    function applyModelTransform() {
      if (!currentVrm || arActiveMode === 'webxr') return;
      if (arActiveMode === 'ios') {
        arPos.y = 0;
        currentVrm.scene.position.copy(arPos);
        currentVrm.scene.rotation.set(0, arYaw, 0);
        shadowBlob.position.set(arPos.x, 0.004, arPos.z);
        shadowBlob.scale.setScalar(modelScale / 0.6);
      } else {
        currentVrm.scene.position.set(modelPos.x, modelPos.y, modelPos.z);
        currentVrm.scene.rotation.set(0, Math.PI, 0);
      }
      currentVrm.scene.scale.set(modelScale, modelScale, modelScale);
    }

    function applyExpression() {
      if (!currentVrm || !currentVrm.blendShapeProxy) return;
      const proxy = currentVrm.blendShapeProxy;
      expressions.forEach((e) => proxy.setValue(e.name, 0));
      const current = expressions[exprIdx];
      if (current.name !== 'neutral') proxy.setValue(current.name, 1.0);
      proxy.update();
    }

    function bone(name) {
      return currentVrm.humanoid.getBoneNode(THREE.VRMSchema.HumanoidBoneName[name]);
    }

    function applyPose(t = 0) {
      if (!currentVrm || !currentVrm.humanoid) return;
      const lU = bone('LeftUpperArm'), lL = bone('LeftLowerArm');
      const rU = bone('RightUpperArm'), rL = bone('RightLowerArm');
      [lU, lL, rU, rL].forEach((n) => n && n.rotation.set(0, 0, 0));
      const s = ARM_SIGN;

      if (poseIdx === 1) {
        if (rU) rU.rotation.z = 1.0 * s;
        if (rL) rL.rotation.z = (0.7 + Math.sin(t * 6) * 0.3) * s;
        if (lU) lU.rotation.z = 1.2 * s;
      } else if (poseIdx === 2) {
        if (lU) lU.rotation.z = 0.9 * s;
        if (lL) lL.rotation.y = -1.2 * s;
        if (rU) rU.rotation.z = -0.9 * s;
        if (rL) rL.rotation.y = 1.2 * s;
      } else {
        if (lU) lU.rotation.z = 1.2 * s;
        if (rU) rU.rotation.z = -1.2 * s;
      }
    }

    function drawCover(ctx, source, w, h, mirror = false) {
      const sw = source.videoWidth || source.width;
      const sh = source.videoHeight || source.height;
      if (!sw || !sh || !w || !h) return;
      const scale = Math.max(w / sw, h / sh);
      const dw = sw * scale, dh = sh * scale;
      ctx.save();
      if (mirror) { ctx.translate(w, 0); ctx.scale(-1, 1); }
      ctx.drawImage(source, (w - dw) * 0.5, (h - dh) * 0.5, dw, dh);
      ctx.restore();
    }

    // ===== RVM =====
    function candidateUrls(path) {
      const list = [path];
      const m = location.hostname.match(/^(.+)\.github\.io$/);
      const repo = location.pathname.split('/')[1];
      if (m && repo) list.push(`https://cdn.jsdelivr.net/gh/${m[1]}/${repo}/${path.replace('./', '')}`);
      return list;
    }

    async function fetchBytes(path) {
      let lastErr;
      for (const url of candidateUrls(path)) {
        for (let attempt = 1; attempt <= 3; attempt++) {
          try {
            const r = await fetch(url);
            if (!r.ok) throw new Error('HTTP ' + r.status + ' khi tải ' + url);
            return new Uint8Array(await r.arrayBuffer());
          } catch (e) {
            lastErr = e;
            setRvm('Tải model lỗi, thử lại ' + attempt + '/3...');
            await new Promise((res) => setTimeout(res, 1500));
          }
        }
      }
      throw lastErr;
    }

    function setRvm(short, full) {
      rvmStatusText = short;
      rvmFullMsg = full || '';
      updateStatus();
    }

    async function initRVM() {
      setRvm('Đang nạp RVM...');
      try {
        ort.env.wasm.numThreads = 1;
        ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/';
        const modelBytes = await fetchBytes(RVM_MODEL_URL);
        if (modelBytes.length < 1000000) {
          throw new Error('File .onnx chỉ ' + modelBytes.length + ' byte (có thể là Git LFS pointer).');
        }
        rvmModelBytes = modelBytes;
        let started = false;
        if (RVM_USE_WORKER) {
          try {
            await startRvmWorker(modelBytes.slice());
            started = true;
          } catch (e) {
            if (rvmWorker) { rvmWorker.terminate(); rvmWorker = null; }
          }
        }
        if (!started) {
          rvmSession = await ort.InferenceSession.create(modelBytes, { executionProviders: ['wasm'] });
        }
        rvmReady = true;
        setRvm(rvmWorker ? 'RVM OK • worker' : 'RVM OK • luồng chính');
        startMatteLoop();
      } catch (err) {
        const msg = String((err && err.message) || err);
        rvmReady = false;
        setRvm('RVM lỗi (chạm để xem)', msg);
      }
    }

    const RVM_WORKER_SRC = `
      importScripts('https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/ort.min.js');
      ort.env.wasm.numThreads = 1;
      ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/';
      let session = null, rec = null;
      const empty = () => new ort.Tensor('float32', new Float32Array(1), [1, 1, 1, 1]);
      const resetRec = () => { rec = { r1i: empty(), r2i: empty(), r3i: empty(), r4i: empty() }; };
      self.onmessage = async (e) => {
        const m = e.data;
        try {
          if (m.type === 'init') {
            session = await ort.InferenceSession.create(m.model, { executionProviders: ['wasm'] });
            resetRec();
            self.postMessage({ type: 'ready' });
          } else if (m.type === 'reset') {
            resetRec();
          } else if (m.type === 'run') {
            const t0 = performance.now();
            const out = await session.run({
              src: new ort.Tensor('float32', m.src, [1, 3, m.h, m.w]),
              r1i: rec.r1i, r2i: rec.r2i, r3i: rec.r3i, r4i: rec.r4i,
              downsample_ratio: new ort.Tensor('float32', new Float32Array([m.ratio]), [1])
            });
            rec = { r1i: out.r1o, r2i: out.r2o, r3i: out.r3o, r4i: out.r4o };
            const pha = Float32Array.from(out.pha.data);
            self.postMessage({ type: 'result', pha, ms: performance.now() - t0 }, [pha.buffer]);
          }
        } catch (err) {
          self.postMessage({ type: 'error', message: String((err && err.message) || err) });
        }
      };
    `;
    let runResolve = null, runReject = null;

    function onRvmMessage(e) {
      const m = e.data;
      const res = runResolve, rej = runReject;
      runResolve = runReject = null;
      if (m.type === 'result' && res) { aiMs = Math.round(m.ms); res(m.pha); }
      else if (m.type === 'error' && rej) rej(new Error(m.message));
    }

    function startRvmWorker(modelBytes) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(new Blob([RVM_WORKER_SRC], { type: 'text/javascript' }));
        rvmWorker = new Worker(url);
        rvmWorker.onerror = (e) => reject(new Error('Worker lỗi: ' + (e.message || 'không khởi tạo được')));
        rvmWorker.onmessage = (e) => {
          if (e.data.type === 'ready') { rvmWorker.onmessage = onRvmMessage; resolve(); }
          else if (e.data.type === 'error') reject(new Error(e.data.message));
        };
        rvmWorker.postMessage({ type: 'init', model: modelBytes }, [modelBytes.buffer]);
      });
    }

    async function inferAlpha(srcData) {
      if (rvmWorker) {
        return new Promise((resolve, reject) => {
          runResolve = resolve; runReject = reject;
          rvmWorker.postMessage({ type: 'run', src: srcData, w: RVM_W, h: RVM_H, ratio: RVM_RATIO }, [srcData.buffer]);
        });
      }
      const t0 = performance.now();
      const results = await rvmSession.run({
        src: new ort.Tensor('float32', srcData, [1, 3, RVM_H, RVM_W]),
        r1i: recStates.r1i, r2i: recStates.r2i, r3i: recStates.r3i, r4i: recStates.r4i,
        downsample_ratio: new ort.Tensor('float32', new Float32Array([RVM_RATIO]), [1])
      });
      recStates = { r1i: results.r1o, r2i: results.r2o, r3i: results.r3o, r4i: results.r4o };
      aiMs = Math.round(performance.now() - t0);
      return results.pha.data;
    }

    function canvasToNCHW(ctx, w, h) {
      const imgData = ctx.getImageData(0, 0, w, h).data;
      const planeSize = w * h;
      const floatData = new Float32Array(3 * planeSize);
      for (let i = 0; i < planeSize; i++) {
        const px = i * 4;
        floatData[i] = imgData[px] / 255;
        floatData[planeSize + i] = imgData[px + 1] / 255;
        floatData[planeSize * 2 + i] = imgData[px + 2] / 255;
      }
      return floatData;
    }

    async function runRVMSegmentation(isMirror) {
      rvmInputCtx.clearRect(0, 0, RVM_W, RVM_H);
      drawCover(rvmInputCtx, videoEl, RVM_W, RVM_H, isMirror);
      const alphaData = await inferAlpha(canvasToNCHW(rvmInputCtx, RVM_W, RVM_H));
      if (!alphaData) return;
      commitMatte(alphaData, RVM_W, RVM_H);
    }

    function engineReady() { return engine === 'mediapipe' ? mpReady : engine === 'hand' ? handReady : rvmReady; }

    async function getMPFileset() {
      if (mpFileset) return;
      let lastErr;
      for (const [bundleUrl, wasmUrl] of MP_BUNDLES) {
        try {
          mpMod = await import(bundleUrl);
          mpFileset = await mpMod.FilesetResolver.forVisionTasks(wasmUrl);
          return;
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error('Không nạp được MediaPipe');
    }

    async function initHand() {
      setRvm('Đang nạp bộ nhận tay...');
      await getMPFileset();
      let lastErr;
      for (const delegate of ['GPU', 'CPU']) {
        try {
          handLm = await mpMod.HandLandmarker.createFromOptions(mpFileset, {
            baseOptions: { modelAssetPath: HAND_MODEL, delegate },
            runningMode: 'VIDEO', numHands: 2
          });
          handDelegate = delegate;
          handReady = true;
          return;
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error('Không nạp được bộ nhận tay');
    }

    function fillTaperedSegment(c, x1, y1, r1, x2, y2, r2) {
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.hypot(dx, dy);
      if (len < 0.001) {
        c.beginPath(); c.arc(x1, y1, r1, 0, Math.PI * 2); c.fill(); return;
      }
      const nx = -dy / len, ny = dx / len;
      c.beginPath();
      c.moveTo(x1 + nx * r1, y1 + ny * r1);
      c.lineTo(x2 + nx * r2, y2 + ny * r2);
      c.lineTo(x2 - nx * r2, y2 - ny * r2);
      c.lineTo(x1 - nx * r1, y1 - ny * r1);
      c.closePath(); c.fill();
      c.beginPath(); c.arc(x1, y1, r1, 0, Math.PI * 2); c.arc(x2, y2, r2, 0, Math.PI * 2); c.fill();
    }

    function drawHandMask(hands) {
      const w = RVM_W, h = RVM_H;
      if (matteCanvas.width !== w || matteCanvas.height !== h) { matteCanvas.width = w; matteCanvas.height = h; }
      const c = matteCtx;
      c.save();
      c.clearRect(0, 0, w, h);
      c.filter = 'blur(2px)';
      c.fillStyle = c.strokeStyle = '#fff';
      c.lineCap = c.lineJoin = 'round';

      for (const lm of hands) {
        const P = lm.map((p) => [p.x * w, p.y * h]);
        const d = (a, b) => Math.hypot(P[a][0] - P[b][0], P[a][1] - P[b][1]);
        const palm = Math.max(d(0, 9), d(5, 17) * 1.15);

        c.beginPath();
        [0, 1, 2, 5, 9, 13, 17].forEach((i, k) => (k ? c.lineTo(P[i][0], P[i][1]) : c.moveTo(P[i][0], P[i][1])));
        c.closePath();
        c.fill();
        c.lineWidth = Math.max(8, palm * 0.34);
        c.stroke();

        const fingers = [
          { idx: [1, 2, 3, 4], base: 0.16, tip: 0.11 },
          { idx: [5, 6, 7, 8], base: 0.135, tip: 0.095 },
          { idx: [9, 10, 11, 12], base: 0.14, tip: 0.095 },
          { idx: [13, 14, 15, 16], base: 0.13, tip: 0.09 },
          { idx: [17, 18, 19, 20], base: 0.12, tip: 0.085 }
        ];
        for (const f of fingers) {
          const pts = f.idx;
          for (let k = 0; k < pts.length - 1; k++) {
            const t1 = k / (pts.length - 1);
            const t2 = (k + 1) / (pts.length - 1);
            const r1 = Math.max(3.5, palm * (f.base * (1 - t1) + f.tip * t1));
            const r2 = Math.max(3.0, palm * (f.base * (1 - t2) + f.tip * t2));
            fillTaperedSegment(c, P[pts[k]][0], P[pts[k]][1], r1, P[pts[k + 1]][0], P[pts[k + 1]][1], r2);
          }
        }

        const mx = (P[5][0] + P[9][0] + P[13][0] + P[17][0]) / 4;
        const my = (P[5][1] + P[9][1] + P[13][1] + P[17][1]) / 4;
        const dx = P[0][0] - mx, dy = P[0][1] - my, len = Math.hypot(dx, dy) || 1;
        const wristR = Math.max(6, d(5, 17) * 0.56);
        const armEndX = P[0][0] + (dx / len) * palm * 2.2;
        const armEndY = P[0][1] + (dy / len) * palm * 2.2;
        fillTaperedSegment(c, P[0][0], P[0][1], wristR, armEndX, armEndY, wristR * 1.15);
      }

      c.restore();
      matteImgData = c.getImageData(0, 0, w, h);
      matteFresh = true;
    }

    function runHandSegmentation(isMirror) {
      rvmInputCtx.clearRect(0, 0, RVM_W, RVM_H);
      drawCover(rvmInputCtx, videoEl, RVM_W, RVM_H, isMirror);
      const ts = Math.max(performance.now(), mpLastTs + 1);
      mpLastTs = ts;
      const res = handLm.detectForVideo(rvmInputCanvas, ts);
      drawHandMask((res && res.landmarks) || []);
    }

    function startMatteLoop() {
      if (matteLoopStarted) return;
      matteLoopStarted = true;
      matteLoop();
    }

    function commitMatte(alphaData, w, h) {
      if (matteCanvas.width !== w || matteCanvas.height !== h) {
        matteCanvas.width = w; matteCanvas.height = h;
        matteImgData = matteCtx.createImageData(w, h);
      }
      const out = matteImgData.data;
      const total = w * h;
      for (let i = 0; i < total; i++) {
        let a = ((alphaData[i] || 0) - ALPHA_LO) / (ALPHA_HI - ALPHA_LO);
        a = a <= 0 ? 0 : a >= 1 ? 1 : a * a * (3 - 2 * a);
        const idx = i * 4;
        out[idx] = 255; out[idx + 1] = 255; out[idx + 2] = 255;
        out[idx + 3] = Math.round(a * 255);
      }
      matteCtx.putImageData(matteImgData, 0, 0);
      matteFresh = true;
    }

    async function initMP() {
      setRvm('Đang nạp MediaPipe...');
      let lastErr;
      for (const [bundleUrl, wasmUrl] of MP_BUNDLES) {
        try {
          const { FilesetResolver, ImageSegmenter } = await import(bundleUrl);
          const fileset = await FilesetResolver.forVisionTasks(wasmUrl);
          for (const delegate of ['GPU', 'CPU']) {
            try {
              mpSegmenter = await ImageSegmenter.createFromOptions(fileset, {
                baseOptions: { modelAssetPath: MP_MODEL, delegate },
                runningMode: 'VIDEO',
                outputConfidenceMasks: true,
                outputCategoryMask: false
              });
              mpDelegate = delegate;
              break;
            } catch (e) { lastErr = e; }
          }
          if (mpSegmenter) break;
        } catch (e) { lastErr = e; }
      }
      if (!mpSegmenter) throw lastErr || new Error('Không nạp được MediaPipe');
      try { mpLabels = mpSegmenter.getLabels() || []; } catch (_) { mpLabels = []; }
      mpReady = true;
    }

    function runMPSegmentation(isMirror) {
      rvmInputCtx.clearRect(0, 0, RVM_W, RVM_H);
      drawCover(rvmInputCtx, videoEl, RVM_W, RVM_H, isMirror);
      const ts = Math.max(performance.now(), mpLastTs + 1);
      mpLastTs = ts;
      mpSegmenter.segmentForVideo(rvmInputCanvas, ts, (result) => {
        const masks = result.confidenceMasks;
        if (!masks || !masks.length) return;
        let idx = masks.length === 1 ? 0 : masks.length - 1;
        const k = mpLabels.findIndex((l) => !/background/i.test(l));
        if (masks.length > 1 && k >= 0 && k < masks.length) idx = k;
        const m = masks[idx];
        commitMatte(m.getAsFloat32Array(), m.width, m.height);
      });
    }

    function selectEngine(name) {
      engine = name;
      if (name === 'mediapipe' || name === 'hand') {
        RVM_W = name === 'hand' ? HAND_W : MP_W; RVM_H = name === 'hand' ? HAND_H : MP_H;
        rvmInputCanvas.width = RVM_W; rvmInputCanvas.height = RVM_H;
      } else {
        setTier(tier);
      }
      matteFresh = false;
      personCtx.clearRect(0, 0, personCanvas.width, personCanvas.height);
      resetRecurrentStates();
    }

    function engineStatus(name) {
      if (name === 'hand') return ['Tách tay OK • ' + handDelegate, ''];
      if (name === 'mediapipe') return ['Tách người OK • ' + mpDelegate, ''];
      return [rvmWorker ? 'RVM OK • worker' : 'RVM OK • luồng chính', ''];
    }

    async function startEngine() {
      const order = [DEFAULT_ENGINE, ...ENGINES.filter((e) => e !== DEFAULT_ENGINE)];
      const errs = [];
      for (const name of order) {
        try {
          if (name === 'hand') await initHand();
          else if (name === 'mediapipe') await initMP();
          else { selectEngine('rvm'); await initRVM(); if (!rvmReady) throw new Error('RVM không nạp được'); }
          selectEngine(name);
          btnEngine.innerText = ENGINE_LABEL[name];
          const [t, full] = engineStatus(name);
          setRvm(t, errs.length ? 'Đã bỏ qua: ' + errs.join(' | ') : full);
          startMatteLoop();
          return;
        } catch (e) {
          errs.push(name + ': ' + String((e && e.message) || e));
        }
      }
      setRvm('Lỗi nạp bộ tách (chạm để xem)', errs.join('\n'));
    }

    function setTier(i) {
      tier = i;
      [RVM_W, RVM_H, RVM_RATIO] = RVM_TIERS[i];
      rvmInputCanvas.width = matteCanvas.width = RVM_W;
      rvmInputCanvas.height = matteCanvas.height = RVM_H;
      matteImgData = matteCtx.createImageData(RVM_W, RVM_H);
      resetRecurrentStates();
      iterTimes = []; tierCooldown = 3;
    }

    async function matteLoop() {
      while (true) {
        const ready = occlusionEnabled && engineReady() && !isSwitchingCam && arActiveMode !== 'webxr' && videoEl.readyState >= 2 && videoEl.videoWidth > 0;
        if (ready) {
          try {
            const iterStart = performance.now();
            const mir = facingMode === 'user';
            await (engine === 'hand' ? runHandSegmentation(mir) : engine === 'mediapipe' ? runMPSegmentation(mir) : runRVMSegmentation(mir));
            iterTimes.push(performance.now() - iterStart);
            if (iterTimes.length > 8) iterTimes.shift();
            if (tierCooldown > 0) {
              tierCooldown--;
            } else if (AUTO_TIER && engine === 'rvm' && iterTimes.length >= 6) {
              const avg = iterTimes.reduce((x, y) => x + y, 0) / iterTimes.length;
              if (avg > 140 && tier > 0) { tierCeil = tier - 1; setTier(tier - 1); }
              else if (avg < 55 && tier < tierCeil) setTier(tier + 1);
            }
            fpsCount++;
          } catch (e) {
            const msg = ((e && e.name) ? e.name + ': ' : '') + String((e && e.message) || e);
            if (engine === 'rvm' && rvmWorker) {
              rvmWorker.terminate(); rvmWorker = null; runResolve = runReject = null;
              try {
                rvmSession = await ort.InferenceSession.create(rvmModelBytes, { executionProviders: ['wasm'] });
                resetRecurrentStates();
                setRvm('RVM OK • luồng chính', msg);
                continue;
              } catch (_) {}
            }
            resetRecurrentStates();
            setRvm('Run lỗi (chạm để xem)', msg);
            await new Promise((r) => setTimeout(r, 500));
          }
          await new Promise((r) => setTimeout(r, engine === 'hand' ? 35 : engine === 'mediapipe' ? 10 : 0));
        } else {
          await new Promise((r) => setTimeout(r, 100));
        }
      }
    }

    // ===== THREE / VRM & HYBRID WEBXR / iOS AR =====
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, 9 / 16, 0.01, 20);
    camera.position.set(0, 1.35, 1.9);

    const renderer = new THREE.WebGLRenderer({ canvas: vrmCanvas, antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.xr.enabled = true;

    const dirLight = new THREE.DirectionalLight(0xffffff, Math.PI);
    dirLight.position.set(1, 2, 1).normalize();
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));

    const xrReticle = new THREE.Mesh(
      new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    xrReticle.matrixAutoUpdate = false;
    xrReticle.visible = false;
    scene.add(xrReticle);

    const iosReticle = new THREE.Mesh(
      new THREE.RingGeometry(0.14, 0.19, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, depthTest: false })
    );
    iosReticle.visible = false;
    iosReticle.renderOrder = 10;
    scene.add(iosReticle);

    const shadowBlob = new THREE.Mesh(
      new THREE.CircleGeometry(0.3, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.32, depthWrite: false })
    );
    shadowBlob.visible = false;
    scene.add(shadowBlob);

    async function detectXRSupport() {
      if (navigator.xr && navigator.xr.isSessionSupported) {
        try {
          webxrSupported = await navigator.xr.isSessionSupported('immersive-ar');
        } catch (_) {
          webxrSupported = false;
        }
      }
      modeBadgeEl.innerText = webxrSupported ? 'WebXR Sàn (6DoF)' : 'iOS / Cam AR';
      if (webxrSupported) {
        const arButtonOptions = {
          requiredFeatures: ['hit-test'],
          optionalFeatures: ['dom-overlay', 'depth-sensing'],
          domOverlay: { root: document.body }
        };
        arButtonEl = ARButton.createButton(renderer, arButtonOptions);
        document.body.appendChild(arButtonEl);
      }
    }

    function onXrSelect() {
      if (arActiveMode === 'webxr' && xrReticle.visible && currentVrm) {
        scene.add(currentVrm.scene);
        currentVrm.scene.position.setFromMatrixPosition(xrReticle.matrix);
        currentVrm.scene.quaternion.setFromRotationMatrix(xrReticle.matrix);
        currentVrm.scene.rotateY(Math.PI);
        currentVrm.scene.scale.set(modelScale, modelScale, modelScale);
        arPlaced = true;
        xrReticle.visible = false;
        hint('Đã đặt nhân vật xuống sàn (WebXR 6DoF)!', 3000);
      }
    }

    const xrController = renderer.xr.getController(0);
    xrController.addEventListener('select', onXrSelect);
    scene.add(xrController);

    // Dừng hoàn toàn luồng camera 2D trước khi WebXR chiếm camera để tránh "AR Interruption Occurred"
    function stopCamera() {
      if (videoEl.srcObject) {
        videoEl.srcObject.getTracks().forEach((t) => t.stop());
        videoEl.srcObject = null;
      }
      camCtx.clearRect(0, 0, camCanvas.width, camCanvas.height);
      personCtx.clearRect(0, 0, personCanvas.width, personCanvas.height);
    }

    renderer.xr.addEventListener('sessionstart', () => {
      arActiveMode = 'webxr';
      arPlaced = false;
      document.documentElement.classList.add('xr-active');
      camCanvas.style.display = 'none';
      personCanvas.style.display = 'none';
      if (currentVrm) scene.remove(currentVrm.scene);
      btnAr.classList.add('active');
      btnAr.innerText = 'AR sàn: BẬT (XR)';
      hint('Quét sàn nhà và nhấn màn hình để đặt nhân vật', 0);
      updateStatus();
    });

    renderer.xr.addEventListener('sessionend', () => {
      arActiveMode = 'none';
      arPlaced = false;
      hitTestSourceRequested = false;
      hitTestSource = null;
      xrReticle.visible = false;
      document.documentElement.classList.remove('xr-active');
      camCanvas.style.display = '';
      personCanvas.style.display = '';
      if (currentVrm) {
        scene.add(currentVrm.scene);
        applyModelTransform();
      }
      btnAr.classList.remove('active');
      btnAr.innerText = 'AR sàn: TẮT';
      hint('');
      startCamera();
      updateStatus();
    });

    function onDeviceOrientation(e) {
      if (e.alpha == null || e.beta == null || e.gamma == null) return;
      if (arAlpha0 === null) arAlpha0 = e.alpha;
      const d = Math.PI / 180;
      const orient = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * d;
      arEuler.set(e.beta * d, (e.alpha - arAlpha0) * d, -e.gamma * d, 'YXZ');
      arTarget.setFromEuler(arEuler);
      arTarget.multiply(arQ1);
      arTarget.multiply(arQ0.setFromAxisAngle(arZ, -orient));
      arLastEvt = performance.now();
      orientHist.push({ t: arLastEvt, q: arTarget.clone() });
      if (orientHist.length > 120) orientHist.shift();
    }

    function orientAt(t, out) {
      const n = orientHist.length;
      if (!n) return out.identity();
      if (t >= orientHist[n - 1].t) return out.copy(orientHist[n - 1].q);
      if (t <= orientHist[0].t) return out.copy(orientHist[0].q);
      let i = n - 1;
      while (i > 0 && orientHist[i - 1].t > t) i--;
      const A = orientHist[i - 1], B = orientHist[i];
      return out.copy(A.q).slerp(B.q, (t - A.t) / Math.max(1, B.t - A.t));
    }

    function updateIosAr() {
      if (arActiveMode !== 'ios') return;
      orientAt(performance.now() - 80, arQuat);
      camera.quaternion.copy(arQuat);
      arCamY = AR_HEIGHTS[arHeightIdx];
      camera.position.set(0, arCamY, 0);

      camera.getWorldDirection(arDir);
      const t = arDir.y < -0.05 ? arCamY / -arDir.y : Infinity;
      if (!arPlaced && t <= 8) {
        iosReticle.position.set(arDir.x * t, 0.003, arDir.z * t);
        iosReticle.visible = true;
      } else {
        iosReticle.visible = false;
      }
      if (currentVrm) {
        currentVrm.scene.visible = arPlaced;
        if (arPlaced) {
          currentVrm.scene.position.set(arPos.x, 0, arPos.z);
          currentVrm.scene.rotation.y = arYaw;
        }
      }
      shadowBlob.visible = arPlaced;
    }

    function placeAtIosReticle() {
      if (arActiveMode !== 'ios' || !currentVrm) return;
      if (!arLastEvt) {
        hint('Hãy cho phép quyền "Chuyển động & hướng" hoặc mở bằng app WebXR Viewer trên iOS.', 5000);
        return;
      }
      camera.getWorldDirection(arDir);
      const t = arDir.y < -0.05 ? arCamY / -arDir.y : Infinity;
      if (t > 8) {
        hint('Nghiêng điện thoại nhẹ xuống sàn nhà để đặt nhân vật.', 3000);
        return;
      }
      arPos.set(arDir.x * t, 0, arDir.z * t);
      arYaw = Math.atan2(-arPos.x, -arPos.z);
      arPlaced = true;
      iosReticle.visible = false;
      applyModelTransform();
      hint('Đã đặt nhân vật trên sàn!', 3000);
    }

    async function toggleIosAr(on) {
      if (on) {
        try {
          if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            const r = await DeviceOrientationEvent.requestPermission();
            if (r !== 'granted') { hint('Cần cho phép "Chuyển động & hướng" để dùng AR.', 4000); return; }
          }
        } catch (e) {
          hint('Lỗi xin quyền cảm biến: ' + String((e && e.message) || e), 5000);
          return;
        }
        window.addEventListener('deviceorientation', onDeviceOrientation, true);
        arAlpha0 = null; arLastEvt = 0; orientHist.length = 0;
        arActiveMode = 'ios'; arPlaced = false;
        savedScale = modelScale; modelScale = 0.6;
        if (facingMode !== 'environment') {
          facingMode = 'environment';
          btnCam.innerText = 'Cam: Sau';
          startCamera();
        }
        camera.fov = AR_FOV; camera.updateProjectionMatrix();
        btnHeight.style.display = '';
        btnAr.classList.add('active'); btnAr.innerText = 'AR sàn: BẬT (iOS)';
        hint('Hướng máy xuống sàn, thấy vòng trắng thì chạm màn hình để đặt nhân vật.', 0);
      } else {
        window.removeEventListener('deviceorientation', onDeviceOrientation, true);
        arActiveMode = 'none'; arPlaced = false;
        iosReticle.visible = false; shadowBlob.visible = false;
        modelScale = savedScale;
        camera.fov = 70; camera.position.set(0, 1.35, 1.9); camera.quaternion.identity(); camera.updateProjectionMatrix();
        if (currentVrm) currentVrm.scene.visible = true;
        btnHeight.style.display = 'none';
        btnAr.classList.remove('active'); btnAr.innerText = 'AR sàn: TẮT';
        hint('');
      }
      applyModelTransform();
      updateStatus();
    }

    new THREE.GLTFLoader().load(
      'model.vrm',
      (gltf) => {
        THREE.VRM.from(gltf).then((vrm) => {
          currentVrm = vrm;
          applyModelTransform();
          applyExpression();
          applyPose(0);
          if (arActiveMode !== 'webxr') scene.add(vrm.scene);
        }).catch((err) => {
          console.error('Lỗi khởi tạo VRM:', err);
        });
      },
      undefined,
      () => { setRvm('Lỗi model.vrm'); }
    );

    let isDragging = false, downX = 0, downY = 0, lastX = 0, lastY = 0;
    vrmCanvas.addEventListener('pointerdown', (e) => {
      isDragging = true; downX = lastX = e.clientX; downY = lastY = e.clientY;
    });
    window.addEventListener('pointermove', (e) => {
      if (!isDragging || !currentVrm || arActiveMode === 'webxr') return;
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      if (arActiveMode === 'ios') {
        if (!arPlaced) return;
        arPos.x = Math.max(-4, Math.min(4, arPos.x + dx * 0.004));
        arPos.z = Math.max(-6, Math.min(2, arPos.z + dy * 0.004));
        applyModelTransform();
        return;
      }
      if (dragMode === 'xy') {
        modelPos.x = Math.max(-1.2, Math.min(1.2, modelPos.x + dx * 0.004));
        modelPos.y = Math.max(-0.8, Math.min(1.0, modelPos.y - dy * 0.004));
      } else {
        modelPos.z = Math.max(-1.5, Math.min(1.0, modelPos.z - dy * 0.005));
      }
      applyModelTransform();
    });
    window.addEventListener('pointerup', (e) => {
      if (arActiveMode === 'ios' && isDragging && Math.hypot(e.clientX - downX, e.clientY - downY) < 12) {
        placeAtIosReticle();
      }
      isDragging = false;
    });

    async function startCamera() {
      if (isSwitchingCam || arActiveMode === 'webxr') return;
      isSwitchingCam = true;
      resetRecurrentStates();
      matteFresh = false;
      personCtx.clearRect(0, 0, personCanvas.width, personCanvas.height);
      updateStatus();

      stopCamera();

      const constraintsList = facingMode === 'environment'
        ? [
            { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
            { video: { facingMode: 'environment' }, audio: false },
            { video: true, audio: false }
          ]
        : [
            { video: { facingMode: { ideal: 'user' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
            { video: { facingMode: 'user' }, audio: false }
          ];

      let opened = false;
      for (const constraints of constraintsList) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          videoEl.srcObject = stream;
          try { await videoEl.play(); } catch (_) {}
          resizeFrame();
          opened = true;
          break;
        } catch (err) {}
      }

      if (!opened) setRvm('Không mở được cam');
      isSwitchingCam = false;
      updateStatus();
    }

    function resizeFrame() {
      if (arActiveMode === 'webxr') return;
      const rect = frameEl.getBoundingClientRect();
      const w = Math.max(1, Math.floor(rect.width));
      const h = Math.max(1, Math.floor(rect.height));
      const k = Math.min(window.devicePixelRatio || 1, 1.5);
      camCanvas.width = Math.round(w * k); camCanvas.height = Math.round(h * k);
      personCanvas.width = camCanvas.width; personCanvas.height = camCanvas.height;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.setSize(w, h);
    }

    window.addEventListener('resize', resizeFrame);

    // ===== NÚT ĐIỀU KHIỂN =====
    btnAr.addEventListener('click', () => {
      if (arActiveMode === 'webxr') {
        const s = renderer.xr.getSession();
        if (s) s.end();
        return;
      }
      if (arActiveMode === 'ios') {
        toggleIosAr(false);
        return;
      }
      if (webxrSupported && arButtonEl) {
        // Giải phóng camera trước để ARKit / ARCore không bị lỗi AR Interruption Occurred
        stopCamera();
        setTimeout(() => arButtonEl.click(), 150);
      } else {
        toggleIosAr(true);
      }
    });

    btnHeight.addEventListener('click', () => {
      arHeightIdx = (arHeightIdx + 1) % AR_HEIGHTS.length;
      arCamY = AR_HEIGHTS[arHeightIdx];
      btnHeight.innerText = `Độ cao máy: ${arCamY.toFixed(1)}m`;
      arPlaced = false;
      hint('Đã đổi độ cao máy, chạm vào sàn để đặt lại nhân vật.', 2500);
    });

    btnCam.addEventListener('click', () => {
      if (isSwitchingCam || arActiveMode === 'webxr') return;
      facingMode = facingMode === 'environment' ? 'user' : 'environment';
      btnCam.innerText = facingMode === 'environment' ? 'Cam: Sau' : 'Cam: Trước';
      if (arActiveMode === 'ios' && facingMode === 'user') toggleIosAr(false);
      startCamera();
    });

    btnOcc.addEventListener('click', () => {
      occlusionEnabled = !occlusionEnabled;
      btnOcc.classList.toggle('active', occlusionEnabled);
      btnOcc.innerText = occlusionEnabled ? 'Che người: BẬT' : 'Che người: TẮT';
      if (!occlusionEnabled) {
        matteFresh = false;
        personCtx.clearRect(0, 0, personCanvas.width, personCanvas.height);
        resetRecurrentStates();
      }
    });

    btnDragMode.addEventListener('click', () => {
      dragMode = dragMode === 'xy' ? 'z' : 'xy';
      btnDragMode.classList.toggle('active', dragMode === 'z');
      btnDragMode.innerText = dragMode === 'xy' ? 'Kéo: Trái/Phải/Lên/Xuống' : 'Kéo: Tới/Lui (Z)';
    });

    btnExpr.addEventListener('click', () => {
      exprIdx = (exprIdx + 1) % expressions.length;
      btnExpr.innerText = `Biểu cảm: ${expressions[exprIdx].label}`;
      applyExpression();
    });

    btnPose.addEventListener('click', () => {
      poseIdx = (poseIdx + 1) % poses.length;
      btnPose.innerText = `Tư thế: ${poses[poseIdx]}`;
      applyPose(performance.now() * 0.001);
    });

    btnPos.addEventListener('click', () => {
      presetIdx = (presetIdx + 1) % presets.length;
      const p = presets[presetIdx];
      modelPos = { x: p.x, y: p.y, z: p.z };
      btnPos.innerText = `Vị trí: ${p.label}`;
      applyModelTransform();
    });

    btnZoomIn.addEventListener('click', () => {
      modelScale = Math.min(1.8, +(modelScale + 0.1).toFixed(2));
      if (arActiveMode === 'webxr' && arPlaced && currentVrm) {
        currentVrm.scene.scale.set(modelScale, modelScale, modelScale);
      } else {
        applyModelTransform();
      }
    });

    btnZoomOut.addEventListener('click', () => {
      modelScale = Math.max(0.25, +(modelScale - 0.1).toFixed(2));
      if (arActiveMode === 'webxr' && arPlaced && currentVrm) {
        currentVrm.scene.scale.set(modelScale, modelScale, modelScale);
      } else {
        applyModelTransform();
      }
    });

    btnReset.addEventListener('click', () => {
      presetIdx = 0;
      modelPos = { x: presets[0].x, y: presets[0].y, z: presets[0].z };
      modelScale = 0.6;
      exprIdx = 0;
      poseIdx = 0;
      btnPos.innerText = `Vị trí: ${presets[0].label}`;
      btnExpr.innerText = `Biểu cảm: ${expressions[0].label}`;
      btnPose.innerText = `Tư thế: ${poses[0]}`;
      if (arActiveMode === 'webxr') {
        arPlaced = false;
        if (currentVrm) scene.remove(currentVrm.scene);
        hint('Quét sàn nhà và nhấn màn hình để đặt lại nhân vật', 0);
      } else if (arActiveMode === 'ios') {
        arPlaced = false;
        hint('Chạm vào sàn để đặt lại nhân vật.', 2500);
        applyModelTransform();
      } else {
        applyModelTransform();
      }
      applyExpression();
      applyPose(0);
    });

    btnUi.addEventListener('click', () => {
      const hidden = frameEl.classList.toggle('ui-hidden');
      btnUi.innerText = hidden ? 'Hiện nút' : 'Ẩn nút';
    });

    btnEngine.addEventListener('click', async () => {
      if (engineSwitching) return;
      engineSwitching = true;
      const next = ENGINES[(ENGINES.indexOf(engine) + 1) % ENGINES.length];
      try {
        if (next === 'hand' && !handReady) await initHand();
        if (next === 'mediapipe' && !mpReady) await initMP();
        if (next === 'rvm' && !rvmReady) await initRVM();
      } catch (e) {
        setRvm('Không đổi được (chạm để xem)', String((e && e.stack) || e));
      }
      const ok = next === 'hand' ? handReady : next === 'mediapipe' ? mpReady : rvmReady;
      if (ok) {
        selectEngine(next);
        btnEngine.innerText = ENGINE_LABEL[next];
        const [t, full] = engineStatus(next);
        setRvm(t, full);
        startMatteLoop();
      }
      engineSwitching = false;
    });

    // ===== VÒNG RENDER =====
    let lastT = performance.now();
    function render(timestamp, frame) {
      const now = timestamp || performance.now();
      if (arActiveMode !== 'webxr' && now - lastT < 1000 / RENDER_FPS_CAP - 5) return;
      const dt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
      lastT = now;

      uiCount++;
      if (now - fpsT >= 1000) {
        maskFps = Math.round((fpsCount * 1000) / (now - fpsT));
        uiFps = Math.round((uiCount * 1000) / (now - fpsT));
        fpsCount = 0; uiCount = 0; fpsT = now;
        updateStatus();
      }

      if (arActiveMode !== 'webxr' && !isSwitchingCam && videoEl.readyState >= 2 && videoEl.videoWidth > 0) {
        camCtx.clearRect(0, 0, camCanvas.width, camCanvas.height);
        drawCover(camCtx, videoEl, camCanvas.width, camCanvas.height, facingMode === 'user');
      }

      if (arActiveMode !== 'webxr' && occlusionEnabled && matteFresh && !isSwitchingCam) {
        const pw = personCanvas.width, ph = personCanvas.height;
        personCtx.globalCompositeOperation = 'source-over';
        personCtx.clearRect(0, 0, pw, ph);
        personCtx.drawImage(camCanvas, 0, 0);
        personCtx.globalCompositeOperation = 'destination-in';
        personCtx.drawImage(matteCanvas, 0, 0, pw, ph);
        personCtx.globalCompositeOperation = 'source-over';
      }

      if (frame && arActiveMode === 'webxr') {
        const referenceSpace = renderer.xr.getReferenceSpace();
        const session = renderer.xr.getSession();

        if (!hitTestSourceRequested && session) {
          session.requestReferenceSpace('viewer').then((viewerSpace) => {
            session.requestHitTestSource({ space: viewerSpace }).then((source) => {
              hitTestSource = source;
            });
          });
          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
            xrReticle.visible = false;
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource && referenceSpace && !xrPlaced) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const pose = hitTestResults[0].getPose(referenceSpace);
            if (pose) {
              xrReticle.visible = true;
              xrReticle.matrix.fromArray(pose.transform.matrix);
            }
          } else {
            xrReticle.visible = false;
          }
        }
      } else if (arActiveMode === 'ios') {
        updateIosAr();
      }

      if (currentVrm) {
        if (poseIdx === 1) applyPose(now * 0.001);
        currentVrm.update(arActiveMode === 'webxr' ? 0.016 : dt);
      }

      renderer.render(scene, camera);
    }

    resizeFrame();
    detectXRSupport();
    startCamera();
    startEngine();
    renderer.setAnimationLoop(render);
  </script>
</body>
</html>
