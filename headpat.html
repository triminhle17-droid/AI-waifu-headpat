<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web AR VRM Headpat</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #info {
            position: absolute; top: 10px; width: 100%; text-align: center;
            color: white; font-family: sans-serif; pointer-events: none; text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>
    <div id="info">Đang tải mô hình VRM và mở Camera...</div>

    <!-- Nhúng các thư viện Three.js, VRM và GLTFLoader từ CDN -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/@pixiv/three-vrm@3.1.1/lib/three-vrm.js"></script>

    <script>
        let scene, camera, renderer, currentVrm;

        init();
        animate();

        function init() {
            // 1. Tạo Scene và Camera
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 20);
            camera.position.set(0, 1.4, 2.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // 2. Thêm ánh sáng
            const light = new THREE.DirectionalLight(0xffffff, Math.PI);
            light.position.set(1, 1, 1).normalize();
            scene.add(light);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            // 3. Tải file mô hình .vrm (Thay đường dẫn 'model.vrm' bằng file của bạn)
            const loader = new THREE.GLTFLoader();
            loader.load(
                'model.vrm',
                (gltf) => {
                    THREE.VRM.from(gltf).then((vrm) => {
                        scene.add(vrm.scene);
                        currentVrm = vrm;
                        vrm.scene.rotation.y = Math.PI; // Quay mặt về phía camera
                        document.getElementById('info').innerText = 'Chạm và kéo trên màn hình để xoay, hoặc đưa tay xoa đầu!';
                    });
                },
                (progress) => console.log('Đang tải: ' + (progress.loaded / progress.total * 100) + '%'),
                (error) => console.error('Lỗi tải mô hình:', error)
            );

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Cập nhật chuyển động vật lý tóc/tai (SpringBone) nếu có VRM
            if (currentVrm) {
                currentVrm.update(0.016); 
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
