<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR VRM Floor Placement</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #info {
            position: absolute; top: 20px; width: 100%; text-align: center;
            color: white; font-size: 16px; pointer-events: none;
            text-shadow: 1px 1px 3px black; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="info">Quét sàn nhà và nhấn màn hình để đặt nhân vật</div>

    <!-- Thư viện Three.js & VRM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/@pixiv/three-vrm@0.6.8/lib/three-vrm.js"></script>

    <script type="module">
        import { ARButton } from 'https://unpkg.com/three@0.128.0/examples/jsm/webxr/ARButton.js';

        let container;
        let camera, scene, renderer;
        let currentVrm = null;
        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let controller;

        init();
        animate();

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // Ánh sáng
            const dirLight = new THREE.DirectionalLight(0xffffff, Math.PI);
            dirLight.position.set(1, 2, 1).normalize();
            scene.add(dirLight);
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));

            // Tải mô hình VRM
            const loader = new THREE.GLTFLoader();
            loader.load(
                'model.vrm',
                (gltf) => {
                    THREE.VRM.from(gltf).then((vrm) => {
                        currentVrm = vrm;
                    }).catch((err) => {
                        console.error('Lỗi khởi tạo VRM:', err);
                    });
                },
                undefined,
                (error) => {
                    console.error('Lỗi tải model.vrm:', error);
                }
            );

            // Vòng tròn định vị mặt phẳng
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // Chỉ bắt buộc hit-test; depth-sensing để optional để tránh treo session trên máy không hỗ trợ
            const arButtonOptions = {
                requiredFeatures: ['hit-test'],
                optionalFeatures: ['dom-overlay', 'depth-sensing'],
                domOverlay: { root: document.body }
            };

            document.body.appendChild(ARButton.createButton(renderer, arButtonOptions));

            // Chạm màn hình để đặt mô hình
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            window.addEventListener('resize', onWindowResize, false);
        }

        function onSelect() {
            if (reticle.visible && currentVrm) {
                scene.add(currentVrm.scene);

                currentVrm.scene.position.setFromMatrixPosition(reticle.matrix);
                currentVrm.scene.quaternion.setFromRotationMatrix(reticle.matrix);
                currentVrm.scene.rotateY(Math.PI);

                // Chỉnh kích thước tại đây (ví dụ 0.6)
                currentVrm.scene.scale.set(0.6, 0.6, 0.6);

                reticle.visible = false;
                document.getElementById('info').innerText = 'Đã đặt nhân vật xuống sàn!';
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (!hitTestSourceRequested && session) {
                    session.requestReferenceSpace('viewer').then((viewerSpace) => {
                        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', () => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                        reticle.visible = false;
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource && referenceSpace) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(referenceSpace);
                        if (pose) {
                            reticle.visible = true;
                            reticle.matrix.fromArray(pose.transform.matrix);
                        }
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            if (currentVrm) {
                currentVrm.update(0.016);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
